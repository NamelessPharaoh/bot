# Config for the in-repo test suite (see CLAUDE.md "Commands").
#
# capture=sys instead of pytest's default fd-level capture: importing main.py
# breaks the fd capture restore, and the symptom is brutal - the entire session
# prints NOTHING while still exiting with the correct status, which reads as
# "no tests ran" to a human and to a CI log. tests/test_main_bootstrap.py
# imports main at module scope, so every run that collects it is affected,
# including the documented `python -m pytest tests -q`. sys-level capture is
# sufficient here: the suite is pure Python and writes nothing from C or from
# subprocesses that would need fd interception.
[pytest]
addopts = --capture=sys
